<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PintarFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                    },
                    animation: {
                        'gradient': 'gradient 8s ease infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    },
                    backgroundSize: {
                        '300%': '300%',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">
    <!-- Horizontal Scroll Progress -->
    <div class="progress-scroll" id="progressScroll"></div>

    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="font-bold text-xl text-primary">PintarFlow</h1>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <svg class="w-4 h-4 absolute top-1/2 left-3 transform -translate-y-1/2 text-gray-500" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Cari module..."
                        class="pl-10 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary/50 w-48 md:w-64">
                </div>
                <button id="toggleDark" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Hero Section with 3D Background -->
        <div class="mb-16 text-center relative overflow-hidden py-0">
            <div class="hero-bg-3d absolute top-0 left-0 w-full h-full opacity-20 -z-10"></div>
            <h1 class="text-4xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-blue-600 via-purple-500 to-cyan-500 bg-clip-text text-transparent bg-300% animate-gradient">
                PintarFlow
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-300 max-w-xl mx-auto">
                AI-built learning platform untuk belajar coding dan teknologi secara praktis dan terarah
            </p>
        </div>

        <section class="mb-10">
            <h3 class="text-2xl font-bold mb-6">📖 Daftar Module Tersedia</h3>

            <div id="filterContainer" class="flex flex-wrap gap-2 mb-6"></div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="moduleList">
            </div>

            <div id="emptySearch" class="hidden text-center py-12">
                <p class="text-gray-500 dark:text-gray-400 text-lg">Tidak ada module yang cocok dengan pencarian kamu
                </p>
            </div>

            <div id="pagination"></div>
        </section>

        <footer
            class="mt-16 pt-6 border-t border-gray-200 dark:border-gray-700 text-center text-gray-500 dark:text-gray-400 text-sm">
            PintarFlow © 2026. Seluruh hak cipta dilindungi.
        </footer>
    </main>

    <!-- Back To Top Button -->
    <button class="back-to-top" id="backToTop" title="Kembali ke atas">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="js/main.js"></script>
    <script>
        // 3D Background Effect
        function initHeroBackground() {
            const container = document.querySelector('.hero-bg-3d');
            if(!container) return;
            
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);
            
            const particlesCount = 2000;
            const positions = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 15;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x165DFF,
                size: 0.08,
                transparent: true,
                opacity: 0.7
            });
            
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            
            camera.position.z = 5;
            
            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.x += 0.0005;
                particles.rotation.y += 0.0008;
                renderer.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', () => {
                camera.aspect = container.offsetWidth / container.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.offsetWidth, container.offsetHeight);
            });
        }
        
        // Initialize after page load
        window.addEventListener('load', initHeroBackground);

        // Module Data
        const modules = [
            { id: 1, title: "SQL Basic", category: "sql", level: "basic", path: "features/sql_basic.html", image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800&h=250&fit=crop", description: "Dasar-dasar database dan query SQL untuk pemula" },
            { id: 2, title: "SQL Intermediate", category: "sql", level: "intermediate", path: "features/sql_intermediate.html", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&h=250&fit=crop", description: "Module lanjutan SQL dengan JOIN, Aggregate, Subquery dan Constraints" },
            { id: 3, title: "SQL Advanced", category: "sql", level: "advanced", path: "features/sql_advanced.html", image: "https://static.vecteezy.com/system/resources/previews/008/612/700/non_2x/sql-word-and-sql-statements-structured-query-language-code-on-a-blue-background-3d-illustration-photo.jpg", description: "Module advanced SQL Window Function, CTE, Index, Transaction dan Optimasi" },
            { id: 4, title: "Pengenalan SQL & Supabase", category: "sql", level: "basic", path: "features/sql_supabase_intro.html", image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800&h=250&fit=crop", description: "Panduan lengkap memahami database dan implementasi dengan platform Supabase" },
            { id: 5, title: "HTML Basic", category: "html", level: "basic", path: "features/html_basic.html", image: "https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=800&h=250&fit=crop", description: "Dasar-dasar HTML untuk membuat struktur halaman website" },
            { id: 6, title: "HTML Intermediate", category: "html", level: "intermediate", path: "features/html_intermediate.html", image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&h=250&fit=crop", description: "Fitur HTML tingkat menengah untuk website modern dan terstruktur" },
            { id: 7, title: "HTML Advanced", category: "html", level: "advanced", path: "features/html_advanced.html", image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&h=250&fit=crop", description: "Fitur HTML tingkat lanjut untuk website profesional dan modern" },
            { id: 8, title: "Javascript Basic", category: "javascript", level: "basic", path: "features/javascript_basic.html", image: "https://previews.123rf.com/images/scandinavianstock/scandinavianstock1409/scandinavianstock140900005/31231336-javascript-concept-blue-background-with-blue-text.jpg", description: "Pengenalan dasar pemrograman Javascript untuk web development" },
            { id: 9, title: "Javascript Intermediate", category: "javascript", level: "intermediate", path: "features/javascript_intermediate.html", image: "https://images.unsplash.com/photo-1579468118864-1b9ea3c0db4a?w=800&h=250&fit=crop", description: "Fitur Javascript tingkat menengah untuk aplikasi web modern" },
            { id: 10, title: "Javascript Advanced", category: "javascript", level: "advanced", path: "features/javascript_advanced.html", image: "https://images.unsplash.com/photo-1516116216624-53e697fedbea?w=800&h=250&fit=crop", description: "Konsep Javascript tingkat advance untuk developer profesional" },
            { id: 11, title: "Docker Pengenalan & Setup Windows", category: "docker", level: "basic", path: "features/docker_intro_windows.html", image: "https://images.unsplash.com/photo-1605745341112-85968b19335b?w=800&h=250&fit=crop", description: "Pengertian Docker dan cara install setup Docker Desktop di Windows dengan WSL 2" },
            { id: 12, title: "Dockerfile Pengertian & Contoh", category: "docker", level: "intermediate", path: "features/docker_dockerfile.html", image: "https://images.unsplash.com/photo-1633356122102-3fe601e05bd2?w=800&h=250&fit=crop", description: "Pengertian Dockerfile, sintaks, best practice dan contoh pembuatan untuk berbagai aplikasi" },
            { id: 13, title: "Workflow Automation Zapier vs Make vs N8N", category: "automation", level: "basic", path: "features/automation_zapier_make_n8n.html", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&h=250&fit=crop", description: "Pengertian Workflow Automation dan perbandingan mendalam Zapier, Make dan N8N" },
            { id: 14, title: "Setup N8N Self Hosted dengan Docker", category: "automation", level: "intermediate", path: "features/automation_n8n_docker_setup.html", image: "https://images.unsplash.com/photo-1605745341112-85968b19335b?w=800&h=250&fit=crop", description: "Langkah demi langkah install dan setup N8N self hosted menggunakan Docker Compose" },
            { id: 15, title: "Laravel Basic", category: "laravel", level: "basic", path: "features/laravel_basic.html", image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800&h=250&fit=crop", description: "Module dasar mempelajari framework Laravel MVC, Routing, Controller, View, dan Eloquent ORM" },
            { id: 16, title: "Laravel Intermediate", category: "laravel", level: "intermediate", path: "features/laravel_intermediate.html", image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800&h=250&fit=crop", description: "Module lanjutan Laravel Validation, Authentication, Eloquent Relationship, Middleware dan Form Request" },
            { id: 17, title: "Laravel Advanced", category: "laravel", level: "advanced", path: "features/laravel_advanced.html", image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800&h=250&fit=crop", description: "Module Laravel tingkat advance Service Container, Event Listener, Queue Job, Repository Pattern, Testing dan Deployment" },
            { id: 18, title: "Pengenalan TailwindCSS", category: "css", level: "intermediate", path: "features/tailwindcss_introduction.html", image: "https://images.unsplash.com/photo-1507721999472-8ed4421c4af2?w=800&h=250&fit=crop", description: "Module pengenalan TailwindCSS Utility First CSS, instalasi, konsep dasar dan best practice profesional" },
            { id: 19, title: "Pengenalan Bootstrap CSS", category: "css", level: "intermediate", path: "features/bootstrap_introduction.html", image: "https://images.unsplash.com/photo-15070032111694-5be0cb4d0a04?w=800&h=250&fit=crop", description: "Module pengenalan Bootstrap CSS framework, grid system, komponen siap pakai dan best practice" }
        ];

        // State
        let currentPage = 1;
        let itemsPerPage = 9;
        let activeFilter = 'all';
        let searchTerm = '';

        // Filter Badges
        const categories = [
            { id: 'all', name: 'Semua' },
            { id: 'sql', name: 'SQL' },
            { id: 'html', name: 'HTML' },
            { id: 'css', name: 'CSS' },
            { id: 'javascript', name: 'Javascript' },
            { id: 'docker', name: 'Docker' },
            { id: 'automation', name: 'Automation' },
            { id: 'laravel', name: 'Laravel' }
        ];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const moduleList = document.getElementById('moduleList');
        const emptySearch = document.getElementById('emptySearch');
        const pagination = document.getElementById('pagination');
        const filterContainer = document.getElementById('filterContainer');

        // Render Filter Buttons
        function renderFilters() {
            filterContainer.innerHTML = categories.map(cat => `
                <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-all ${activeFilter === cat.id ? 'bg-primary text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'}">
                    ${cat.name}
                </button>
            `).join('');

            document.querySelectorAll('.filter-btn').forEach((btn, index) => {
                btn.addEventListener('click', () => {
                    activeFilter = categories[index].id;
                    currentPage = 1;
                    renderModules();
                    renderFilters();
                });
            });
        }

        // Get Filtered Modules
        function getFilteredModules() {
            return modules.filter(module => {
                const matchesSearch = module.title.toLowerCase().includes(searchTerm) || module.description.toLowerCase().includes(searchTerm);
                const matchesFilter = activeFilter === 'all' || module.category === activeFilter;
                return matchesSearch && matchesFilter;
            });
        }

        // Render Modules
        function renderModules() {
            const filtered = getFilteredModules();
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filtered.slice(start, end);

            if (pageItems.length === 0 && (searchTerm.length > 0 || activeFilter !== 'all')) {
                emptySearch.classList.remove('hidden');
            } else {
                emptySearch.classList.add('hidden');
            }

            const levelColors = {
                basic: 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400',
                intermediate: 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400',
                advanced: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400'
            };

            const levelText = {
                basic: 'Basic',
                intermediate: 'Intermediate',
                advanced: 'Advanced'
            };

            moduleList.innerHTML = pageItems.map(module => `
                <a href="${module.path}" class="module-card block bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all hover:-translate-y-1">
                    <img src="${module.image}" alt="${module.title}" class="w-full h-40 object-cover">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="text-xl font-bold">${module.title}</h4>
                            <span class="px-3 py-1 ${levelColors[module.level]} rounded-full text-sm font-medium">
                                ${levelText[module.level]}
                            </span>
                        </div>
                        <p class="text-gray-600 dark:text-gray-400">${module.description}</p>
                    </div>
                </a>
            `).join('');

            renderPagination(filtered.length);
        }

        // Render Pagination
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHtml = '<div class="flex justify-center items-center gap-2 mt-8">';

            if (currentPage > 1) {
                paginationHtml += `<button class="pagination-btn px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700" onclick="changePage(${currentPage - 1})">←</button>`;
            }

            for (let i = 1; i <= totalPages; i++) {
                const active = i === currentPage ? 'bg-primary text-white' : 'bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700';
                paginationHtml += `<button class="pagination-btn px-4 py-2 rounded-lg ${active}" onclick="changePage(${i})">${i}</button>`;
            }

            if (currentPage < totalPages) {
                paginationHtml += `<button class="pagination-btn px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700" onclick="changePage(${currentPage + 1})">→</button>`;
            }

            paginationHtml += '</div>';
            pagination.innerHTML = paginationHtml;
        }

        // Change Page
        function changePage(page) {
            currentPage = page;
            renderModules();
            window.scrollTo({ top: moduleList.offsetTop - 100, behavior: 'smooth' });
        }

        // Search Event
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            currentPage = 1;
            renderModules();
        });

        // Initialize
        renderFilters();
        renderModules();
    </script>
</body>

</html>
